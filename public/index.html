
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric-Imperial Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      color: #1e293b;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Metric-Imperial Converter</h1>

    <form id="convertForm">
      <input
        type="text"
        id="input"
        placeholder="Enter value e.g. 10L, 5kg, 3mi"
        required
      >
      <button type="submit">Convert</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('convertForm').addEventListener('submit',
      async function(event) {
        event.preventDefault();

        const input = document.getElementById('input').value;
        const result = document.getElementById('result');

        try {
          const response = await fetch(
            `/api/convert?input=${encodeURIComponent(input)}`
          );

          const data = await response.json();

          result.textContent = data.string || data.error;
        } catch (error) {
          result.textContent = 'Unable to connect to server';
        }
      }
    );
  </script>
</body>
</html>
